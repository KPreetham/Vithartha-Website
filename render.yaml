services:
  # Backend Web Service
  - type: web
    name: vithartha-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://vithartha-frontend.onrender.com
      - key: DOCUMENT_LINK_LIFETIME_SECONDS
        value: 8
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: DOCUMENT_EMAIL_INTERVAL_HOURS
        value: 720
      - key: AUTO_EMAIL_CHECK_INTERVAL_MINUTES
        value: 15
      - key: AUTO_EMAIL_DOCUMENTS_ENABLED
        value: true

  # Frontend Static Site
  - type: web
    name: vithartha-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vithartha-backend.onrender.com/api # Matches backend
      - key: VITE_DOCUMENT_LINK_LIFETIME_SECONDS
        value: 8
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_OPENROUTER_API_KEY
        sync: false
